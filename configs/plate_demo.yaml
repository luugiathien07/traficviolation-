# Hiện biển số của mọi xe trên hình (bản Java, plate.read_all). Video samples/vn_plates_stills.mp4 ghép từ
# các ảnh chụp biển số Việt Nam trong eval/vn (ảnh tĩnh, 3 giây mỗi ảnh), chỉ để thử phần đọc biển.
camera_id: cam-plate
source: samples/vn_plates_stills.mp4
loop: true
realtime: true

detector:
  model: models/yolo11s.pt
  conf: 0.3
  imgsz: 1280
  device: null
  tracker: bytetrack.yaml
  classes: [car, motorcycle, bus, truck]

backlight:
  mode: "off"

plate:
  enabled: true
  detector: models/plate-v1s.pt
  det_conf: 0.25
  min_conf: 0.6
  min_plate_width: 25
  two_row_mode: best
  retry_seconds: 2.0
  read_all: true
  read_all_every: 0.3
  read_all_min_width: 60

light:
  mode: manual
  initial: green

rules: {}
